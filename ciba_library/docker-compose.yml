services:
  db:
    image: postgres:16
    container_name: ciba-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ciba
      POSTGRES_PASSWORD: ciba
      POSTGRES_DB: ciba
    ports:
      - "5432:5432"
    volumes:
      - ciba-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ciba -d ciba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ciba-db-data:
