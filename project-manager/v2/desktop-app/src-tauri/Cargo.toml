[package]
name = "project-manager"
version = "0.2.1"
description = "Project Manager desktop app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "project_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde_json = "1" # the generate_context! macro expands to code that uses it

# Desktop only: one running copy (passing on apurvdas-pm:// links), and updates.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

# A small, quick-starting binary is the point of using Tauri.
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true
